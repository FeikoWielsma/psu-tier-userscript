name: PSU Tier List CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Chromium for offline browser and extension tests
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Validate reviewed snapshot, source contracts and exact build artifacts
        run: python test_suite.py --release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psutier-validation
          path: |
            reports/
            psutier.user.js
            psutier-extension.zip
