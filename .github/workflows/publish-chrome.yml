name: Publish Chrome from GitHub release

# Recovers a Chrome upload when the tag workflow already signed Firefox and
# validated the zip, but stopped before the Chrome Web Store step.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose validated psutier-extension.zip to upload
        required: true
        default: v2.0.18
        type: string
      mode:
        description: status only reports the store item; upload submits the release zip
        required: true
        default: upload
        type: choice
        options:
          - status
          - upload

permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Download the validated extension archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --pattern psutier-extension.zip --output psutier-extension.zip

      - name: Read Chrome Web Store item status
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          node --input-type=module <<'EOF'
          const body = new URLSearchParams({
            client_id: process.env.CWS_CLIENT_ID,
            client_secret: process.env.CWS_CLIENT_SECRET,
            refresh_token: process.env.CWS_REFRESH_TOKEN,
            grant_type: "refresh_token",
          });
          const tokenResponse = await fetch("https://oauth2.googleapis.com/token", {method: "POST", body});
          const token = await tokenResponse.json();
          if (!token.access_token) {
            console.log(JSON.stringify({tokenError: token.error, description: token.error_description}));
            process.exit(1);
          }
          const extensionId = process.env.CWS_EXTENSION_ID || "ngjfcbgocgihemnfbfffikmcdpplhemf";
          const publisherId = process.env.CWS_PUBLISHER_ID;
          const response = await fetch(
            `https://chromewebstore.googleapis.com/v2/publishers/${publisherId}/items/${extensionId}:fetchStatus`,
            {headers: {Authorization: `Bearer ${token.access_token}`}}
          );
          const payload = await response.json().catch(() => ({}));
          const redact = (value) => {
            if (Array.isArray(value)) return value.map(redact);
            if (value && typeof value === "object") {
              return Object.fromEntries(
                Object.entries(value)
                  .filter(([key]) => !/token|secret|publicKey|email|name/i.test(key))
                  .map(([key, item]) => [key, redact(item)])
              );
            }
            return value;
          };
          console.log(response.status, JSON.stringify(redact(payload), null, 2));
          if (!response.ok) process.exit(1);
          EOF

      - name: Publish to Chrome Web Store
        if: inputs.mode == 'upload'
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ] || [ -z "$PUBLISHER_ID" ]; then
            echo "::error::Chrome Web Store credentials are not set."
            exit 1
          fi
          node --input-type=module <<'EOF'
          const body = new URLSearchParams({
            client_id: process.env.CLIENT_ID,
            client_secret: process.env.CLIENT_SECRET,
            refresh_token: process.env.REFRESH_TOKEN,
            grant_type: "refresh_token",
          });
          const tokenResponse = await fetch("https://oauth2.googleapis.com/token", {method: "POST", body});
          const token = await tokenResponse.json();
          if (!token.access_token) {
            console.log(JSON.stringify({tokenError: token.error, description: token.error_description}));
            process.exit(1);
          }
          const extensionId = process.env.EXTENSION_ID || "ngjfcbgocgihemnfbfffikmcdpplhemf";
          const publisherId = process.env.PUBLISHER_ID;
          const headers = {Authorization: `Bearer ${token.access_token}`};
          const statusResponse = await fetch(
            `https://chromewebstore.googleapis.com/v2/publishers/${publisherId}/items/${extensionId}:fetchStatus`,
            {headers}
          );
          const status = await statusResponse.json();
          const versionOf = (revision) => revision?.distributionChannels?.[0]?.crxVersion;
          const publishedVersion = versionOf(status.publishedItemRevisionStatus);
          const submitted = status.submittedItemRevisionStatus;
          const submittedVersion = versionOf(submitted);
          if (!submitted) {
            console.log(`No in-review submission. Published version is ${publishedVersion}.`);
          } else if (submitted.state === "PENDING_REVIEW" && submittedVersion === publishedVersion) {
            console.log(`Cancelling the in-review resubmission of already published ${submittedVersion}.`);
            const cancel = await fetch(
              `https://chromewebstore.googleapis.com/v2/publishers/${publisherId}/items/${extensionId}:cancelSubmission`,
              {method: "POST", headers: {...headers, "Content-Type": "application/json"}, body: "{}"}
            );
            const cancelBody = await cancel.json().catch(() => ({}));
            console.log(cancel.status, JSON.stringify({
              state: cancelBody.submittedItemRevisionStatus?.state || cancelBody.error?.status,
              message: cancelBody.error?.message,
            }));
            if (!cancel.ok) process.exit(1);
          } else {
            console.log(`Refusing to cancel in-review ${submittedVersion} (${submitted.state}); published is ${publishedVersion}.`);
            process.exit(1);
          }
          EOF
          npx --yes chrome-webstore-upload-cli@4 --source psutier-extension.zip
