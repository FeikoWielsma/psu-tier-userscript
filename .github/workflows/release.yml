name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dev dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # No pip install needed - the pipeline is standard-library only.
      - name: Build userscript from the latest sheet
        run: python generate_userscript.py --update

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: psutier.user.js
          generate_release_notes: true
