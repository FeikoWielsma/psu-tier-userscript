name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dev dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # No pip install needed - the pipeline is standard-library only.
      - name: Build userscript and extension from the latest sheet
        run: |
          python generate_userscript.py --update
          python build_extension.py

      - name: Sign Firefox extension
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            npx web-ext sign --source-dir dist-extension --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --channel unlisted
            mv web-ext-artifacts/*.xpi ./psutier-extension.xpi
          else
            echo "AMO credentials not set, skipping extension signing."
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            psutier.user.js
            psutier-extension.zip
            psutier-extension.xpi
          fail_on_unmatched_files: false
          generate_release_notes: true
